name: PokeTama V10 - Web Flasher
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "poketama-test-1-web-flasher"
  cancel-in-progress: true
jobs:
  build:
    name: Compiler et preparer le Web Flasher V10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tests moteur
        run: make -C tests clean && make -C tests test
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"
      - name: Restaurer le cache de compilation
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
            ~/.cache/arduino
            ~/.cache/pip
          key: poketama-esp32-3.3.11-libs-v1-${{ runner.os }}
      - name: Installer ESP32 3.3.11
        run: |
          arduino-cli config init || true
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          if ! arduino-cli core list | grep -q 'esp32:esp32.*3.3.11'; then
            arduino-cli core update-index
            arduino-cli core install esp32:esp32@3.3.11
          fi
      - name: Installer les bibliotheques PokeTama
        run: |
          if ! arduino-cli lib list | grep -q 'GFX Library for Arduino'; then
            arduino-cli lib update-index
            arduino-cli lib install "GFX Library for Arduino" "SensorLib" "XPowersLib"
          fi
      - name: Cache neuf des sources originales PMD
        uses: actions/cache@v4
        with:
          path: |
            tools/pmd_cache
            tools/sdcard/mons/p*.bin
            tools/sdcard/mons/ps*.bin
            tools/sdcard/mons/thumbs.bin
          key: poketama-pmd-original-386-v3-${{ hashFiles('tools/pack_pmd.py', 'tools/make_thumbs.py') }}
      - name: Installer Pillow pour les sprites
        run: |
          python3 -c "from PIL import Image" 2>/dev/null || python3 -m pip install Pillow
          python3 -c "from PIL import Image; print('Pillow OK:', Image.__version__)"
      - name: Regenerer et auditer les sept sols de combat
        run: |
          python3 tools/generate_battle_ground_map.py
          python3 tools/make_battle_bases.py
          python3 tools/audit_battle_grounds.py
      - name: Compiler et recharger les sprites originaux
        run: chmod +x tools/build_web.sh && bash tools/build_web.sh
      - name: Auditer les tailles des 386 Pokemon en combat
        run: python3 tools/audit_battle_sprite_sizes.py
      - name: Verifier la page et les binaires
        run: python3 tools/verify_web.py
      - name: Afficher directement le Web Flasher sur Test-2
        if: github.repository == 'Moretro3D/Test-2'
        run: |
          sed -i '/http-equiv="refresh"/d' web/index.html
          sed -i '/location.replace("https:\/\/moretro3d.fr\/pages\/poketama");/d' web/index.html
          grep -q '<esp-web-install-button' web/index.html
          ! grep -q 'location.replace' web/index.html
      - uses: actions/configure-pages@v5
      - name: Preparer GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    name: Publier les fichiers du Web Flasher
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier le Web Flasher
        id: deployment
        uses: actions/deploy-pages@v4
